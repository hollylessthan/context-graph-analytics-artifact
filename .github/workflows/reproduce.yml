name: Verify frozen export
on:
  pull_request:
    paths:
      - 'evidence/**'
      - 'scripts/**'
      - '.github/workflows/reproduce.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch and verify frozen stage-local evidence
        run: python scripts/fetch_stage_evidence.py
      - name: Upload verified stage-local source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: verified-stage-local-evidence
          path: stage-local-evidence.zip
          if-no-files-found: error
      - name: Check frozen summaries
        run: python scripts/check_export.py
      - name: Reproduce all paired outcomes and verify ZIP checksums
        run: python scripts/reproduce_paired.py evidence/context-graph-paired-evidence-curated.zip
